<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
    body{
        background:#0c0c0c;
        color:#fff;
        margin:0;
        font-family:Arial, sans-serif;
        text-align:center;
    }

    /* Cabeçalho */
    header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 30px;
        background-color: rgba(0,0,0,0.7);
        position: sticky;
        top: 0;
        z-index: 10;
        box-sizing: border-box;
    }

    header img { max-height: 70px; max-width: 170px; }

    nav {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
        max-width: 60%;
        justify-content: flex-end;
    }

    nav a {
        font-size: 15px;
        text-decoration: none;
        color: #d4af37;
        font-weight: bold;
        transition:.3s;
        white-space: nowrap;
    }

    nav a:hover { color:#ff0000; }

    #menuBtn {
        display:none;
        background:transparent;
        border:1px solid rgba(212,175,55,0.4);
        color:#d4af37;
        padding:6px 12px;
        border-radius:6px;
        cursor:pointer;
        font-size:16px;
    }

    /* Container Login */
    .login-container{
        max-width:400px;
        margin:80px auto;
        padding:30px;
        background:#111;
        border-radius:10px;
        box-shadow:0 0 15px #000;
    }

    h2{
        color:#d4af37;
        margin-bottom:25px;
        font-size:26px;
    }

    form{
        display:flex;
        flex-direction:column;
        gap:15px;
    }

    label{
        text-align:left;
        font-size:15px;
    }

    input{
        padding:12px;
        border:1px solid #d4af37;
        background:#0c0c0c;
        color:#fff;
        border-radius:6px;
        font-size:16px;
        outline:none;
    }

    input:focus{
        border-color:#ffffff;
        box-shadow:0 0 8px #d4af37;
    }

    button{
        background:#d4af37;
        color:#000;
        padding:14px;
        font-size:18px;
        font-weight:bold;
        border:none;
        border-radius:8px;
        cursor:pointer;
        transition:.3s;
    }

    button:hover{
        background:#fff;
        color:#000;
        transform:scale(1.05);
    }

 /* Rodapé */
    footer{
        background:#000;
        text-align:center;
        padding:30px 20px;
        margin-top:40px;
    }
    footer img{
        max-width:140px;
        margin-bottom:10px;
    }
    footer p{margin:6px 0;color:#ccc;}

    @media(max-width:900px){
        nav{gap:10px;max-width:55%;}
        nav a{font-size:14px;}
        header img{max-height:55px;}
    }
</style>

<script>
    function fazerLogin(event){
        event.preventDefault();
        window.location.href = "{{ url_for('areadocliente') }}";
    }
</script>

</head>

<body>

<header>
    <img src="{{ url_for('static', filename='Imagens/logo.png') }}" alt="Glamour Service Logo">
    <button id="menuBtn">☰ Menu</button>

    <nav id="mainNav">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('contato') }}">Contato</a>
        <a href="{{ url_for('form_orcamento') }}">Faça um Orçamento</a>
        <a href="{{ url_for('login_cliente') }}">Área do Cliente</a>
    </nav>
</header>


<div class="login-container">
    <h2>Login do Cliente</h2>

    <form onsubmit="fazerLogin(event)">
        <label>E-mail</label>
        <input type="email" placeholder="Digite seu e-mail" required>

        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha" required>

        <button type="submit">Entrar</button>
    </form>
</div>

<footer>
    <img src="{{ url_for('static', filename='Imagens/logo.png') }}" alt="Logo Glamour Service">
    <p>Glamour Service • Excelência e requinte para momentos especiais.</p>

    <!-- Contato discreto -->
    <p style="color:#b89d44; font-size:14px; margin-top:6px;">
        📞 (00) 90000-0000 • ✉ contato@glamourservice.com
    </p>

    <p style="color:#777;font-size:13px;margin-top:6px;">
        © 2025 Glamour Service. Todos os direitos reservados.
    </p>
</footer>

</body>
</html>
